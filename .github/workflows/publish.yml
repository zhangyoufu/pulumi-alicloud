# WARNING: This file is autogenerated - changes will be overwritten when regenerated by https://github.com/pulumi/ci-mgmt
name: Publish

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      isPrerelease:
        required: true
        type: boolean
      skipGoSdk:
        default: false
        type: boolean
        description: Skip publishing & verifying the Go SDK
      skipJavaSdk:
        default: false
        type: boolean
        description: Skip publishing the Java SDK

env:
  IS_PRERELEASE: ${{ inputs.isPrerelease }}
  ALICLOUD_ACCESS_KEY: ${{ secrets.ALICLOUD_ACCESS_KEY }}
  ALICLOUD_REGION: us-west-1
  ALICLOUD_SECRET_KEY: ${{ secrets.ALICLOUD_SECRET_KEY }}
  PULUMI_API: https://api.pulumi-staging.io
  PULUMI_GO_DEP_ROOT: ${{ github.workspace }}/..
  PULUMI_LOCAL_NUGET: ${{ github.workspace }}/nuget
  TF_APPEND_USER_AGENT: pulumi

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
    - name: Validate prerelease
      if: inputs.isPrerelease == false && (contains(inputs.version, '-') || contains(inputs.version, '+'))
      run: echo "Can't publish a prerelease version as a stable release. This is likely a bug in the calling workflow." && exit 1
    - name: Validate skipGoSdk
      if: inputs.skipGoSdk && inputs.isPrerelease == false
      run: echo "Can't skip Go SDK for stable releases. This is likely a bug in the calling workflow." && exit 1
    - name: Checkout Repo
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - name: Setup tools
      uses: ./.github/actions/setup-tools
      with:
        tools: pulumictl, pulumicli, go, schema-tools
        cache-go: false
    - name: Configure AWS Credentials
      if: false
      uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-region: us-east-2
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        role-duration-seconds: 7200
        role-external-id: upload-pulumi-release
        role-session-name: alicloud@githubActions
        role-to-assume: ${{ secrets.AWS_UPLOAD_ROLE_ARN }}
    - name: Create dist directory
      run: mkdir -p dist
    - name: Download provider assets
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: pulumi-resource-alicloud-v${{ inputs.version }}-*
        path: dist
        # Don't create a directory for each artifact
        merge-multiple: true
    - name: Download schema
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        # Use a pattern to avoid failing if the artifact doesn't exist
        pattern: schema-embed.*
        # Avoid creating directories for each artifact
        merge-multiple: true
        path: dist
    - name: Download SDKs
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        pattern: '*-sdk.tar.gz'
        path: sdk-artifact
        # Don't create a directory for each artifact
        merge-multiple: true
    - name: Prepare SDKs
      run: |-
        cp sdk-artifact/dotnet.tar.gz dist/pulumi-resource-alicloud-v${{ inputs.version }}-sdk-dotnet.tar.gz
        DIR=$(mktemp -d); tar -C "$DIR" -xf sdk-artifact/go.tar.gz --strip-components=2 ./alicloud && tar -C "$DIR" -czf dist/pulumi-resource-alicloud-v${{ inputs.version }}-sdk-go.tar.gz . && rm -rf "$DIR"
        DIR=$(mktemp -d); tar -C "$DIR" -xf sdk-artifact/nodejs.tar.gz --strip-components=2 ./bin && tar -C "$DIR" -czf dist/pulumi-resource-alicloud-v${{ inputs.version }}-sdk-nodejs.tar.gz . && rm -rf "$DIR"
        tar -C dist -xf sdk-artifact/python.tar.gz --strip-components=3 ./bin/dist
        tar -C dist -xf sdk-artifact/java.tar.gz --strip-components=3 ./build/libs/com.pulumi.alicloud.jar
    - name: Calculate checksums
      working-directory: dist
      run: shasum ./*.tar.gz ./*.whl ./*.jar > "pulumi-alicloud_${{ inputs.version }}_checksums.txt"
    - name: Get Schema Change Summary
      id: schema-summary
      shell: bash
      run: |
        REPLACE=$(go -C provider list -m -json github.com/aliyun/terraform-provider-alicloud | jq -cr .Replace)
        REPLACE_PATH=$(jq -r .Path <<< "$REPLACE")
        REPLACE_VERSION=$(jq -r .Version <<< "$REPLACE")
        BODY="${REPLACE_PATH}@${REPLACE_VERSION}"
        if [ "${REPLACE_VERSION#v0.0.0-}" != "$REPLACE_VERSION" ]; then
          REPLACE_VERSION=$(cut -d- -f3 <<< ${REPLACE_VERSION})
        fi
        if [ "${REPLACE_PATH#github.com/}" != "$REPLACE_PATH" ]; then
          BODY="[${BODY}](https://${REPLACE_PATH}/commits/${REPLACE_VERSION})"
        fi
        {
          echo 'summary<<EOF'
          echo "$BODY"
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"
    - name: Upload Provider Binaries
      if: false
      run: aws s3 cp dist s3://get.pulumi.com/releases/plugins/ --recursive
    - name: Create GH Release
      uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2
      with:
        tag_name: v${{ inputs.version }}
        prerelease: ${{ inputs.isPrerelease }}
        body: ${{ steps.schema-summary.outputs.summary }}
        generate_release_notes: false
        files: dist/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_sdk:
    name: publish_sdk
    needs: publish
    if: false
    runs-on: ubuntu-latest
    outputs:
      python_version: ${{ steps.python_version.outputs.version }}
    steps:
    - name: Checkout Repo
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        # Persist credentials so we can push back to the repo
        persist-credentials: true
    - name: Setup tools
      uses: ./.github/actions/setup-tools
      with:
        tools: pulumictl, pulumicli, nodejs, python, dotnet, go, java
        cache-go: false
    - name: Publish SDKs
      if: inputs.skipJavaSdk == false
      uses: pulumi/pulumi-package-publisher@c1672c7928591d563dccb12729e05e315c21f8c2 # v0.0.22
      with:
        sdk: all
        version: ${{ inputs.version }}
      env:
        PYPI_USERNAME: __token__
        PYPI_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        SIGNING_KEY: ${{ secrets.JAVA_SIGNING_KEY }}
        SIGNING_KEY_ID: ${{ secrets.JAVA_SIGNING_KEY_ID }}
        SIGNING_PASSWORD: ${{ secrets.JAVA_SIGNING_PASSWORD }}
        PUBLISH_REPO_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        PUBLISH_REPO_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        NUGET_PUBLISH_KEY: ${{ secrets.NUGET_PUBLISH_KEY }}
    - name: Publish SDKs (except Java)
      if: inputs.skipJavaSdk == true
      uses: pulumi/pulumi-package-publisher@c1672c7928591d563dccb12729e05e315c21f8c2 # v0.0.22
      with:
        sdk: all,!java
        version: ${{ inputs.version }}
      env:
        PYPI_USERNAME: __token__
        PYPI_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        SIGNING_KEY: ${{ secrets.JAVA_SIGNING_KEY }}
        SIGNING_KEY_ID: ${{ secrets.JAVA_SIGNING_KEY_ID }}
        SIGNING_PASSWORD: ${{ secrets.JAVA_SIGNING_PASSWORD }}
        NUGET_PUBLISH_KEY: ${{ secrets.NUGET_PUBLISH_KEY }}
    - name: Download Go SDK
      uses: ./.github/actions/download-sdk
      with:
        language: go
    - uses: pulumi/publish-go-sdk-action@v1
      if: inputs.skipGoSdk == false
      with:
        repository: ${{ github.repository }}
        base-ref: ${{ github.sha }}
        source: sdk
        path: sdk
        version: ${{ inputs.version }}
        additive: false
        # Avoid including other language SDKs & artifacts in the commit
        files: |
          go.*
          go/**
          !*.tar.gz
    - name: Extract python version
      id: python_version
      working-directory: sdk/python
      run: |
        pip install toml-cli==0.7.0
        version=$(toml get --toml-path pyproject.toml project.version)
        echo "version=${version}" >> "$GITHUB_OUTPUT"
  create_docs_build:
    name: create_docs_build
    needs: publish_sdk
    # Only run for non-prerelease, if the publish_go_sdk job was successful or skipped
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Metadata build
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3
        with:
          token: ${{ secrets.PULUMI_BOT_TOKEN }}
          repository: pulumi/registry
          event-type: resource-provider
          client-payload: |-
            {
              "project": "${{ github.repository }}",
              "project-shortname": "alicloud",
              "ref": "${{ github.ref_name }}"
            }

  clean_up_release_labels:
    name: Clean up release labels
    # Only run for non-prerelease, if the publish_go_sdk job was successful or skipped
    if: false
    needs: create_docs_build
    
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repo
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false
    - name: Clean up release labels
      uses: pulumi/action-release-by-pr-label@main
      with:
        command: "clean-up-release-labels"
        repo: ${{ github.repository }}
        commit: ${{ github.sha }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify_release:
    name: verify_release
    needs: publish_sdk
    if: false
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/verify-release.yml
    secrets: inherit
    with:
      providerVersion: ${{ inputs.version }}
      skipGoSdk: ${{ inputs.skipGoSdk }}
      pythonVersion: ${{ needs.publish_sdk.outputs.python_version }}
